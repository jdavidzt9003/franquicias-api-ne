services:
  db:
    image: postgres:16-alpine
    container_name: franquicias-db
    environment:
      POSTGRES_DB: franquicias
      POSTGRES_USER: franquicias
      POSTGRES_PASSWORD: franquicias
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franquicias -d franquicias"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: franquicias-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/franquicias
      DB_USER: franquicias
      DB_PASSWORD: franquicias
    ports:
      - "8080:8080"

volumes:
  pgdata:
