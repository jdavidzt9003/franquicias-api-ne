spring:
  application:
    name: franquicias-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/franquicias}
    username: ${DB_USER:franquicias}
    password: ${DB_PASSWORD:franquicias}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
